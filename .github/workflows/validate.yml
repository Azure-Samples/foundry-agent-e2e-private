name: Validate sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r .\src\pet-insurance\requirements.txt -r .\src\pet-insurance-api\requirements.txt -r .\tests\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
      - name: Test OpenAPI contract and handlers
        run: |
          python -m unittest discover -s .\tests -p test_openapi.py
          if ($LASTEXITCODE -ne 0) { throw 'OpenAPI tests failed.' }
      - name: Load MCP application
        run: |
          python -c "import runpy; runpy.run_path(r'src\pet-insurance\function_app.py')"
          if ($LASTEXITCODE -ne 0) { throw 'MCP application import failed.' }
      - name: Check PowerShell syntax
        run: |
          Get-ChildItem .\scripts\*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Test deployment scripts without Azure resources
        run: .\scripts\Test-Deploy.ps1
      - name: Install pinned Bicep compiler
        run: |
          az bicep install --version v0.44.1
          if ($LASTEXITCODE -ne 0) { throw 'Bicep installation failed.' }
      - name: Build and verify portal template
        run: |
          .\scripts\Build-PortalTemplate.ps1
          git --no-pager diff --exit-code -- azuredeploy.json
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate azuredeploy.json with Bicep v0.44.1 and commit it.' }
